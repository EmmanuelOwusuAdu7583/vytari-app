<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-shadow {
            box-shadow: 0 20px 40px rgba(61, 105, 43, 0.04);
        }
        .hero-gradient {
            background: radial-gradient(circle at 50% 0%, #f0f7ed 0%, #f8f9fb 70%);
        }
        .bento-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(61, 105, 43, 0.08);
        }
        @keyframes shimmer-sweep {
            0% { transform: translateX(-150%) skewX(-25deg); }
            100% { transform: translateX(150%) skewX(-25deg); }
        }
        .liquid-glass {
            background: rgba(61, 105, 43, 0.85) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .liquid-glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer-sweep 3s infinite linear;
            pointer-events: none;
        }
        .liquid-glass:hover {
            transform: scale(1.02);
            background: rgba(61, 105, 43, 0.95) !important;
        }
        .liquid-expand {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .liquid-expand:active {
            transform: scale(0.97);
        }
        .htoggle-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .htoggle-switch input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .htoggle-bg {
            width: 44px;
            height: 24px;
            background: #c2c9ba;
            border-radius: 9999px;
            transition: background-color 0.15s;
        }
        .htoggle-switch input:checked + .htoggle-bg {
            background-color: #3d692b;
        }
        .htoggle-dot {
            position: absolute;
            left: 2px;
            top: 2px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 9999px;
            transition: transform 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .htoggle-switch input:checked ~ .htoggle-dot {
            transform: translateX(20px);
        }
        .hstar-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 4px;
        }
        .hstar-rating input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .hstar-rating label {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            color: #73796c;
            transition: transform 0.15s, color 0.15s;
        }
        .hstar-rating label::before { content: 'star'; }
        .hstar-rating input:checked ~ label,
        .hstar-rating label:hover,
        .hstar-rating label:hover ~ label {
            color: #3d692b;
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .skeleton {
            background: linear-gradient(90deg, #edeef0 25%, #e1e2e4 50%, #edeef0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            height: 16px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .tag-chip {
            transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.15s ease;
        }
        .tag-chip:active { transform: scale(0.96); }
        .tag-chip.selected {
            border-color: #3d692b;
            background-color: #a7d98e4d;
            color: #265015;
        }
        @keyframes tubelight-in {
            from { opacity: 0; transform: translateX(-50%) scaleX(0.4); }
            to { opacity: 1; transform: translateX(-50%) scaleX(1); }
        }
        .tubelight-lamp {
            animation: tubelight-in 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible {
            outline: 2.5px solid #3d692b;
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
    </style>
